version: "2"

run:
  concurrency: 4
  timeout: 1m
  issues-exit-code: 1
  tests: true
  modules-download-mode: vendor
  allow-parallel-runners: false

output:
  formats:
    tab:
      path: stdout

issues:
  uniq-by-line: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - "SA*"
        - "S*"
  exclusions:
    paths:
      - vendor
      - pkg/tools
      - pkg/schema/schema.go

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - vendor
      - pkg/tools
      - pkg/schema/schema.go
